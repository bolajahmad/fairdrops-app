name: CI

on:
  push:
    branches: [main, "fairdrops/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fairdrops
          POSTGRES_PASSWORD: fairdrops
          POSTGRES_DB: fairdrops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fairdrops -d fairdrops"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: foundry-rs/foundry-toolchain@v1

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm check:emoji

      - run: pnpm turbo run lint typecheck test build
        env:
          FOUNDRY_PROFILE: ci

      - name: Committed contract ABI matches the sources
        run: pnpm --filter @fairdrops/contracts abi:check
