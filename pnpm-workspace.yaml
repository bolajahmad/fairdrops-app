packages:
  - apps/*
  - packages/*

allowBuilds:
  "@prisma/engines": true
  "@swc/core": true
  # Optional native speed-up for BullMQ's msgpackr, which falls back to JavaScript without it.
  msgpackr-extract: false
  prisma: true
  unrs-resolver: true
  pnpm: true
  # Pulled in by Privy's wallet libraries. Native speed-ups with JavaScript fallbacks, and a
  # post-install the browser bundle doesn't need, so none of them run.
  "@reown/appkit": false
  bufferutil: false
  keccak: false
  utf-8-validate: false

catalog:
  "@privy-io/node": 0.35.0
  "@privy-io/react-auth": 3.47.0
  "@eslint/js": 9.39.5
  "@graphprotocol/graph-cli": 0.98.1
  "@graphprotocol/graph-ts": 0.38.2
  "@nestjs/cli": 12.0.6
  "@nestjs/common": 12.1.0
  "@nestjs/core": 12.1.0
  "@nestjs/platform-express": 12.1.0
  "@nestjs/testing": 12.1.0
  "@noble/hashes": 2.0.1
  "@openzeppelin/contracts": 5.6.1
  "@openzeppelin/merkle-tree": 1.0.8
  "@prisma/adapter-pg": 7.10.0
  "@prisma/client": 7.10.0
  "@radix-ui/react-dialog": 1.1.23
  "@radix-ui/react-radio-group": 1.4.7
  "@radix-ui/react-tooltip": 1.2.16
  "@swc/core": 1.16.2
  "@tailwindcss/postcss": 4.3.3
  "@types/express": 5.0.6
  "@types/node": 24.13.6
  "@types/pg": 8.23.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@types/supertest": 7.2.1
  "@types/ws": 8.18.1
  assemblyscript: 0.19.23
  bullmq: 6.3.9
  clsx: 2.1.1
  eslint: 9.39.5
  eslint-config-next: 16.3.6
  forge-std: github:foundry-rs/forge-std#v1.16.2
  globals: 17.12.0
  ioredis: 6.0.0
  jose: 6.2.12
  lucide-react: 1.48.0
  matchstick-as: 0.6.0
  next: 16.3.6
  next-themes: 0.4.6
  pg: 8.23.0
  prettier: 3.9.9
  prisma: 7.10.0
  react: 19.3.0
  react-dom: 19.3.0
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  supertest: 7.3.0
  tailwind-merge: 3.7.0
  tailwindcss: 4.3.3
  turbo: 2.11.3
  typescript: 6.0.3
  typescript-eslint: 8.70.1
  unplugin-swc: 2.0.0
